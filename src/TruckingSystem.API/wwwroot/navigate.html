<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Điều hướng chuyến đi</title>
    <!-- Leaflet CSS/JS load qua CDN — không cần cài npm/build gì cả, trang HTML thuần.
         Trang này thay thế endpoint /gps_tracker/navigate (không tồn tại trong hệ
         thống) — được app tài xế (React Native) mở qua WebView khi bấm "Open Navigation". -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .header { background: #1565C0; color: white; padding: 14px 16px; }
        .header h1 { margin: 0; font-size: 16px; }
        .header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
        .info-bar {
            display: flex; justify-content: space-around; background: white;
            padding: 10px; font-size: 13px; border-bottom: 1px solid #e0e0e0;
        }
        .info-bar b { color: #1565C0; }
        #map { height: calc(100vh - 90px); }
        .error { color: #C62828; text-align: center; padding: 40px 16px; }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="headerTitle">🗺️ Đang tải lộ trình...</h1>
        <div class="sub" id="headerSub"></div>
    </div>
    <div class="info-bar" id="infoBar" style="display:none;">
        <div>📏 <b id="distanceText">—</b></div>
        <div>⏱ <b id="durationText">—</b></div>
    </div>
    <div id="map"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const tripId = params.get('tripId');
        const apiBase = window.location.origin; // cùng domain với API

        let map, myPositionMarker;

        async function loadNavigation() {
            if (!tripId) {
                document.getElementById('map').outerHTML = '<div class="error">Thiếu mã chuyến (tripId) trong đường dẫn.</div>';
                return;
            }
            try {
                // Bước 1: lấy DANH SÁCH ĐIỂM DỪNG đúng theo chặng — chặng Lấy
                // hàng có 3 điểm (Kho xuất phát -> Đối tác lấy hàng -> Kho nộp
                // hàng, round-trip THẬT vì xe phải quay về), chặng Giao hàng
                // chỉ 2 điểm (Kho -> Điểm giao, 1 chiều).
                const routeInfoResp = await fetch(`${apiBase}/api/trips/${tripId}/route`);
                if (!routeInfoResp.ok) {
                    document.getElementById('map').outerHTML = '<div class="error">Không tìm thấy chuyến, vui lòng kiểm tra lại Trip ID.</div>';
                    return;
                }
                const routeInfo = await routeInfoResp.json();

                const legText = routeInfo.legType === 'Pickup' ? '🔽 Lấy hàng (round-trip qua Kho)' : '🔼 Giao hàng (Kho → Khách nhận)';
                document.getElementById('headerTitle').textContent = `Đơn ${routeInfo.orderCode}`;
                document.getElementById('headerSub').textContent = legText;

                const validStops = (routeInfo.stops || []).filter(s => s.lat && s.lng);
                if (validStops.length < 2) {
                    document.getElementById('map').outerHTML = '<div class="error">Chuyến này thiếu tọa độ (điểm chưa chọn từ gợi ý VietMap, hoặc kho chưa có tọa độ) — không vẽ được lộ trình.</div>';
                    return;
                }

                // Bước 2: tính lộ trình thật qua VietMap cho TỪNG ĐOẠN liên tiếp
                // (VD 3 điểm dừng = 2 đoạn: đoạn 1 + đoạn 2), cộng dồn khoảng
                // cách/thời gian cả các đoạn lại để hiện tổng đúng thực tế.
                const segments = [];
                let totalDistanceKm = 0, totalDurationMin = 0, tileUrlTemplate = null;

                for (let i = 0; i < validStops.length - 1; i++) {
                    const from = validStops[i], to = validStops[i + 1];
                    const resp = await fetch(`${apiBase}/api/routes/calculate?fromLat=${from.lat}&fromLng=${from.lng}&toLat=${to.lat}&toLng=${to.lng}`);
                    const seg = await resp.json();
                    segments.push(seg);
                    if (seg.success) {
                        totalDistanceKm += seg.distanceKm;
                        totalDurationMin += seg.durationMinutes;
                        tileUrlTemplate = tileUrlTemplate || seg.tileUrlTemplate;
                    }
                }

                if (totalDistanceKm > 0) {
                    document.getElementById('infoBar').style.display = 'flex';
                    document.getElementById('distanceText').textContent = `${totalDistanceKm.toFixed(1)} km`;
                    document.getElementById('durationText').textContent = `${totalDurationMin} phút`;
                }

                renderMap(segments, validStops, tileUrlTemplate);
                startWatchingMyLocation();
            } catch (e) {
                document.getElementById('map').outerHTML = '<div class="error">Lỗi kết nối tới máy chủ.</div>';
            }
        }

        /// Vẽ TẤT CẢ các đoạn nối tiếp nhau (không chỉ 1 đoạn) — mỗi đoạn 1
        /// polyline riêng, cùng màu nối liền mạch trông như 1 lộ trình xuyên
        /// suốt; đặt marker kèm nhãn (Label) tại TỪNG điểm dừng để tài xế biết
        /// rõ đây là điểm gì (xuất phát/lấy hàng/về kho/giao hàng).
        function renderMap(segments, stops, tileUrlTemplate) {
            map = L.map('map');
            const tileUrl = tileUrlTemplate || 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
            L.tileLayer(tileUrl, { attribution: '&copy; VietMap', maxZoom: 19 }).addTo(map);

            let allBoundsPoints = [];
            segments.forEach(seg => {
                if (seg.success && seg.points && seg.points.length > 0) {
                    const points = seg.points.map(p => [p.lat, p.lng]);
                    L.polyline(points, { color: '#1565C0', weight: 5, opacity: 0.85 }).addTo(map);
                    allBoundsPoints = allBoundsPoints.concat(points);
                }
            });

            stops.forEach((s, idx) => {
                const icon = idx === 0 ? '📍' : (idx === stops.length - 1 ? '🏁' : '📦');
                L.marker([s.lat, s.lng]).addTo(map).bindPopup(`${icon} ${s.label}`);
                allBoundsPoints.push([s.lat, s.lng]);
            });

            if (allBoundsPoints.length > 0) {
                map.fitBounds(L.latLngBounds(allBoundsPoints), { padding: [30, 30] });
            }
        }

        // Chấm xanh vị trí HIỆN TẠI của tài xế trên bản đồ (dùng GPS ngay trong
        // WebView, khác với việc gửi GPS lên server — đó là do App.js làm ngầm
        // ở background, đây chỉ để tài xế TỰ NHÌN thấy mình đang ở đâu trên bản đồ).
        function startWatchingMyLocation() {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition(
                (pos) => {
                    const latlng = [pos.coords.latitude, pos.coords.longitude];
                    if (!myPositionMarker) {
                        myPositionMarker = L.circleMarker(latlng, { radius: 8, color: '#2563EB', fillColor: '#2563EB', fillOpacity: 1 })
                            .addTo(map).bindPopup('📍 Vị trí của bạn');
                    } else {
                        myPositionMarker.setLatLng(latlng);
                    }
                },
                () => { /* không có quyền GPS trong WebView cũng không sao, chỉ mất chấm xanh */ },
                { enableHighAccuracy: true, maximumAge: 5000 }
            );
        }

        loadNavigation();
    </script>
</body>
</html>
